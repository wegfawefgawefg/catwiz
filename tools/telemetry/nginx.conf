# Catwiz's play records on the dev VPS: in /etc/nginx/sites-enabled/gauche-roomd. The zone goes
# at the top (http level), the locations in the 443 server, before its catch-all "location /".
# No access log and no error log for them: nothing keeps a player's address (the zone holds
# addresses in memory only, for the rate limit). The receiver sends its own CORS header; the
# player posts text/plain, a simple request, so no preflight is needed (the server's OPTIONS
# rule answers one without it).

limit_req_zone $binary_remote_addr zone=catwiz_telemetry:1m rate=1r/s;

    location = /catwiz-telemetry {
        limit_req zone=catwiz_telemetry burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8795;
        proxy_read_timeout 5s;
        access_log off;
        error_log /dev/null;
    }
    location = /catwiz-telemetry/health {
        proxy_pass http://127.0.0.1:8795;
        proxy_read_timeout 5s;
        access_log off;
        error_log /dev/null;
    }
